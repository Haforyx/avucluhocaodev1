name: Flutter ödevi

on:
  push:
    paths:
      - 'flutter_odev/**'
      - '.github/workflows/flutter_odev.yml'
  pull_request:
    paths:
      - 'flutter_odev/**'
      - '.github/workflows/flutter_odev.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_odev

jobs:
  test:
    name: Analiz + testler + web derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: avuclu-hoca-apk
          path: flutter_odev/build/app/outputs/flutter-apk/app-release.apk
